sonar.projectKey=happihub
sonar.projectName=HappiHub
sonar.sources=client/src,server
sonar.tests=client/src,server/tests,e2e
sonar.test.inclusions=client/src/**/*.test.js,client/src/**/*.test.jsx,server/tests/**,e2e/*.js,e2e/support/**,e2e/tests/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/__pycache__/**,server/tests/**,client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/setupTests.js,**/.env*,server/jest.config.*,server/babel.config.*,server/domain/data/**,server/scripts/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,server/coverage/integration/lcov.info,client/coverage/lcov.info
# Operator entry points are covered through the jobs they call (jest collectCoverageFrom).
sonar.coverage.exclusions=server/jobs/runSeedDemo.js
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
