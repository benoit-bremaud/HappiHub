sonar.projectKey=happihub
sonar.projectName=HappiHub
sonar.sources=client/src,server
sonar.tests=client/src,server/tests
sonar.test.inclusions=client/src/**/*.test.js,client/src/**/*.test.jsx,server/tests/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/__pycache__/**,server/tests/**,client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/setupTests.js,**/.env*,server/jest.config.*,server/babel.config.js,server/domain/data/**,server/scripts/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
