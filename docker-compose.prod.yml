# Production baseline only: requires deployment review, private secrets and TLS termination.
services:
  client:
    build:
      context: ./client
      target: runtime
      args:
        REACT_APP_API_URL: /api
    ports:
      - "127.0.0.1:${HAPPIHUB_PROD_WEB_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
  server:
    build:
      context: ./server
      target: runtime
    environment:
      NODE_ENV: production
      JWT_SECRET_PROD_FILE: /run/secrets/jwt_key
      JWT_EXPIRATION_PROD: 15m
      MONGO_URI_PROD_FILE: /run/secrets/mongo_uri
      APP_URL_PROD: "${HAPPIHUB_PROD_ORIGIN:?Supply the exact public origin}"
      PORT_PROD: "5000"
    secrets:
      - jwt_key
      - mongo_uri
    networks: [frontend, database]
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  mongo:
    networks: [database]
    image: mongo:7.0.40@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: happihub
    secrets:
      - mongo_root_user
      - mongo_root_password
      - mongo_app_user
      - mongo_app_password
    volumes:
      - prod_mongo_data:/data/db
      - ./docker/mongo/init-app.js:/docker-entrypoint-initdb.d/init-app.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  prod_mongo_data:
secrets:
  jwt_key:
    file: "${HAPPIHUB_SECRETS_DIR:?Supply the private secret directory}/jwt_key"
  mongo_uri:
    file: "${HAPPIHUB_SECRETS_DIR}/mongo_uri"
  mongo_root_user:
    file: "${HAPPIHUB_SECRETS_DIR}/mongo_root_user"
  mongo_root_password:
    file: "${HAPPIHUB_SECRETS_DIR}/mongo_root_password"
  mongo_app_user:
    file: "${HAPPIHUB_SECRETS_DIR}/mongo_app_user"
  mongo_app_password:
    file: "${HAPPIHUB_SECRETS_DIR}/mongo_app_password"

networks:
  frontend:
  database:
    internal: true
