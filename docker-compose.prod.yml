# Production baseline only: requires deployment review, private secrets and TLS termination.
services:
  client:
    build:
      context: ./client
      target: runtime
      args:
        REACT_APP_API_URL: /api
    ports:
      - "127.0.0.1:${HAPPIHUB_PROD_WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${HAPPIHUB_TRUSTED_INGRESS_FILE:?Supply the absolute trusted ingress configuration path}"
        target: /etc/nginx/happihub/trusted-ingress.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      frontend:
        ipv4_address: "${HAPPIHUB_PROXY_IP:-10.254.240.2}"
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
  server:
    build:
      context: ./server
      target: runtime
    environment:
      NODE_ENV: production
      SESSION_SECRET_PROD_FILE: /run/secrets/session_key
      TRUSTED_PROXY: "${HAPPIHUB_PROXY_IP:-10.254.240.2}"
      DATABASE_URL_PROD_FILE: /run/secrets/database_url
      APP_URL_PROD: "${HAPPIHUB_PROD_ORIGIN:?Supply the exact public origin}"
      PORT_PROD: "5000"
    secrets:
      - session_key
      - database_url
    networks:
      frontend:
        ipv4_address: "${HAPPIHUB_API_IP:-10.254.240.3}"
      database: {}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  postgres:
    networks: [database]
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: happihub
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d happihub -U \"$$(cat /run/secrets/postgres_user)\""]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  prod_postgres_data:
secrets:
  session_key:
    file: "${HAPPIHUB_SECRETS_DIR:?Supply the private secret directory}/session_key"
  database_url:
    file: "${HAPPIHUB_SECRETS_DIR}/database_url"
  postgres_user:
    file: "${HAPPIHUB_SECRETS_DIR}/postgres_user"
  postgres_password:
    file: "${HAPPIHUB_SECRETS_DIR}/postgres_password"

networks:
  frontend:
    ipam:
      config:
        - subnet: "${HAPPIHUB_FRONTEND_SUBNET:-10.254.240.0/28}"
  database:
    internal: true
