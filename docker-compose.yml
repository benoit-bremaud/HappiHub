# Local development only. Use a distinct Compose project name per workspace.
services:
  client:
    build:
      context: ./client
      target: local
    ports:
      - "127.0.0.1:${HAPPIHUB_LOCAL_WEB_PORT:-3200}:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:${HAPPIHUB_LOCAL_API_PORT:-5200}/api"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client/src:/app/src:ro
      - ./client/public:/app/public:ro
    networks: [frontend]
    depends_on:
      server:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  server:
    build:
      context: ./server
      target: local
    env_file:
      - ./server/.env.docker.local
    environment:
      NODE_ENV: development
      DATABASE_URL_DEV: postgres://happihub:happihub-local@postgres:5432/happihub_local
      PORT_DEV: "5000"
      APP_URL_DEV: "http://localhost:${HAPPIHUB_LOCAL_WEB_PORT:-3200}"
      FIELD_KEYRING_FILE_DEV: /run/keys/field-keyring.dev.json
    volumes:
      # Generated locally and git-ignored (spec db-encryption-at-rest § 6.1).
      - ./server/.keys/field-keyring.dev.json:/run/keys/field-keyring.dev.json:ro
    ports:
      - "127.0.0.1:${HAPPIHUB_LOCAL_API_PORT:-5200}:5000"
    networks: [frontend, database]
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  postgres:
    networks: [database]
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: happihub
      # Local, non-secret development credential on an internal network only.
      POSTGRES_PASSWORD: happihub-local
      POSTGRES_DB: happihub_local
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "happihub", "-d", "happihub_local"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  local_postgres_data:

networks:
  frontend:
  database:
    internal: true
