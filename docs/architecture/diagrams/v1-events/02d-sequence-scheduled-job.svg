="522.365">done (each step resumable on next run)</text><path d="M177,541.174 L177,604.174 L480,604.174 L480,551.174 L470,541.174 L177,541.174 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M470,541.174 L470,551.174 L480,551.174 L470,541.174 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="282" x="183" y="560.071">Every step is a bounded batch and idempotent:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="277" x="183" y="577.777">a crash mid-run is safe, the next run continues.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="240" x="183" y="595.4831">Emails only go through the outbox (Q2).</text><!--MD5=[05d1449bf517f1185175b3552b9c94d6]
@startuml
title sd — Scheduled maintenance job (hourly, idempotent)
skinparam shadowing false
autonumber
participant "Scheduler" as S
participant "Maintenance job" as J
database "Data store" as D

S -> J : run (hourly), single instance lock
J -> D : archive PUBLISHED and CANCELLED events whose end passed (J3 D3)
J -> D : lift suspensions whose endsAt passed (AD2)\n+ moderation log + outbox notice
J -> D : drafts untouched 50 weeks without notice:\noutbox notice "deleted in 14 days" (S2)
J -> D : drafts untouched 12 months and notified: delete with images (S2)
J -> D : API keys unused 166 days without notice:\noutbox notice "revoked in 14 days" (I1)
J -> D : API keys unused 180 days and notified: revoke + activity entry (I1)
J -> D : closed associations past 30 days\nwith no active suspension: delete content and log (F2, S1)
J -> D : purge activity entries and moderation log older than 12 months
J -> D : expire PENDING invitations past expiresAt
J - -> S : done (each step resumable on next run)
note over J
  Every step is a bounded batch and idempotent:
  a crash mid-run is safe, the next run continues.
  Emails only go through the outbox (Q2).
end note
@enduml

