server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Edge security headers (spec: docs/architecture/specs/edge-security-headers.md).
    # Keep them in the server block only: a location that declares its own add_header
    # drops every inherited one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://stackpath.bootstrapcdn.com; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The container is only reachable through the operator's TLS edge; browsers ignore
    # HSTS received over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The operator identifies the controlled TLS edge as observed by this container.
    include /etc/nginx/happihub/trusted-ingress.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    location /api/ {
        # No rewrite means the peer or its forwarded client address was not usable.
        if ($remote_addr = $realip_remote_addr) {
            return 403;
        }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        # Runtime ingress requires upstream HTTPS termination. Ignore caller-supplied scheme.
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
