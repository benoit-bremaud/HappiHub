server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    # The operator identifies the controlled TLS edge as observed by this container.
    include /etc/nginx/happihub/trusted-ingress.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    location /api/ {
        # No rewrite means the peer or its forwarded client address was not usable.
        if ($remote_addr = $realip_remote_addr) {
            return 403;
        }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        # Runtime ingress requires upstream HTTPS termination. Ignore caller-supplied scheme.
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
